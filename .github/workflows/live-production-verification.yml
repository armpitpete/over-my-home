name: Live production verification

on:
  pull_request:
    paths:
      - .github/workflows/live-production-verification.yml

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe deployed homepage and aircraft API
        shell: bash
        run: |
          node <<'NODE'
          const base='https://over-my-home.pages.dev';
          async function get(url){
            try {
              const r=await fetch(url,{signal:AbortSignal.timeout(30000)});
              return {status:r.status,body:await r.text(),cache:r.headers.get('x-over-my-home-cache'),cfRay:r.headers.get('cf-ray')};
            } catch(e) { return {status:0,body:'',error:e.message}; }
          }
          const home=await get(base+'/');
          const url=base+'/api/aircraft?postcode=YO32%209QU&range=18';
          const api=await get(url);
          const second=await get(url);
          let data={}; try{data=JSON.parse(api.body)}catch{}
          const result={
            homepage:{status:home.status,bytes:home.body.length,cfRay:home.cfRay,graphicalSky:home.body.includes('Graphical local sky'),airplanesLive:home.body.includes('Airplanes.live'),confirmedMilitary:home.body.includes('Confirmed military'),accessibleList:home.body.includes('id="aircraft-list"')},
            api:{status:api.status,cache:api.cache,provider:data?.source?.provider,postcode:data?.location?.postcode,rangeKm:data?.rangeKm,aircraftCount:Array.isArray(data?.aircraft)?data.aircraft.length:null,nonCommercial:data?.source?.nonCommercial,refreshSeconds:data?.source?.refreshSeconds,error:data?.error||api.error},
            secondApi:{status:second.status,cache:second.cache,error:second.error}
          };
          console.log('LIVE_RESULT='+JSON.stringify(result));
          const ok=result.homepage.status===200&&result.homepage.graphicalSky&&result.homepage.airplanesLive&&result.homepage.confirmedMilitary&&result.homepage.accessibleList&&result.api.status===200&&result.api.provider==='Airplanes.live'&&result.api.postcode==='YO32 9QU'&&result.api.rangeKm===18&&result.api.nonCommercial===true&&result.api.refreshSeconds===300&&result.secondApi.status===200&&result.secondApi.cache==='HIT';
          if(!ok) process.exitCode=1;
          NODE
