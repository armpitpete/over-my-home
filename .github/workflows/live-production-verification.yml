name: Live production verification

on:
  pull_request:
    paths:
      - .github/workflows/live-production-verification.yml
      - scripts/live-production-verify.mjs

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe deployed homepage and aircraft API
        run: node scripts/live-production-verify.mjs
