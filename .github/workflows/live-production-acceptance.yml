name: Live production acceptance

on:
  push:
    branches:
      - agent/live-production-acceptance
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acceptance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Test deployed production
        env:
          LIVE_URL: https://over-my-home.pages.dev
          ACCEPTANCE_POSTCODE: YO32 9QU
        run: node scripts/live-production-acceptance.mjs
      - name: Test live shared tile cache
        env:
          LIVE_URL: https://over-my-home.pages.dev
        run: node scripts/live-provider-cache-acceptance.mjs
      - name: Discover official Airplanes.live contact email
        if: always() && github.event_name == 'push'
        run: node scripts/send-airplanes-live-request.mjs
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-production-acceptance
          path: live-acceptance-artifacts
          if-no-files-found: error
          retention-days: 7
      - name: Upload contact-submission evidence
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: airplanes-live-contact-submission
          path: contact-submission
          if-no-files-found: warn
          retention-days: 7
      - name: Record reports on branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          FILES=()
          [ -f live-acceptance-artifacts/report.json ] && FILES+=(live-acceptance-artifacts/report.json)
          [ -f contact-submission/report.json ] && FILES+=(contact-submission/report.json)
          if [ "${#FILES[@]}" -eq 0 ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${FILES[@]}"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record live acceptance and contact results [skip acceptance]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
