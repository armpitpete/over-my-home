name: Live production acceptance

on:
  push:
    branches:
      - agent/live-production-acceptance
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acceptance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Test deployed production
        env:
          LIVE_URL: https://over-my-home.pages.dev
          ACCEPTANCE_POSTCODE: YO32 9QU
        run: node scripts/live-production-acceptance.mjs
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-production-acceptance
          path: live-acceptance-artifacts
          if-no-files-found: error
          retention-days: 7
      - name: Record acceptance report on branch
        if: always() && github.event_name == 'push'
        run: |
          if [ ! -f live-acceptance-artifacts/report.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f live-acceptance-artifacts/report.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record live acceptance result [skip acceptance]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
