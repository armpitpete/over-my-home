name: Send Airplanes.live request

on:
  push:
    branches:
      - agent/live-production-acceptance

permissions:
  contents: write

jobs:
  send:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Submit approved contact request
        run: node scripts/send-airplanes-live-request.mjs
      - name: Upload submission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airplanes-live-contact-submission
          path: contact-submission
          if-no-files-found: error
          retention-days: 7
      - name: Record submission report
        if: always()
        run: |
          if [ ! -f contact-submission/report.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f contact-submission/report.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Airplanes.live contact submission [skip contact]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
